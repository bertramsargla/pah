# Builds and tests the app on a macOS runner.
# Manual only (Actions tab > iOS build > Run workflow), because macOS minutes
# count 10x against the GitHub Actions allowance on private repos.
name: iOS build

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9A-Za-z ]+ \(' | sed 's/ ($//')
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -project WangSwipe.xcodeproj \
            -scheme WangSwipe \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO
