# XcodeGen spec. Run `xcodegen generate` to create WangSwipe.xcodeproj.
name: WangSwipe
options:
  bundleIdPrefix: com.wangswipe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WangSwipe:
    type: application
    platform: iOS
    sources:
      - path: WangSwipe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wangswipe.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WangSwipe
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: WangSwipe uses the camera so you can take a full-body photo to try clothes on.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: WangSwipe lets you pick a full-body photo of yourself to try clothes on.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  WangSwipeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WangSwipeTests
    dependencies:
      - target: WangSwipe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wangswipe.app.tests
schemes:
  WangSwipe:
    build:
      targets:
        WangSwipe: all
        WangSwipeTests: [test]
    test:
      targets:
        - WangSwipeTests
